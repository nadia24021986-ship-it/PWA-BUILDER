<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Kuesioner Peserta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <main class="max-w-md mx-auto p-4 space-y-6 pt-6">
        <!-- 1. GATEKEEPING FORM -->
        <div id="participant-gate" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <div class="text-center">
                <h2 class="text-xl font-black text-amber-400">Kuesioner Seminar</h2>
                <p class="text-xs text-slate-400">Silakan lengkapi profil Anda untuk memulai.</p>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Nama Lengkap</label>
                <input type="text" id="p-name" placeholder="Nama Anda" class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Jabatan</label>
                <input type="text" id="p-role" placeholder="Contoh: Staff / Supervisor" class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Area Kerja</label>
                <input type="text" id="p-area" placeholder="Contoh: Jakarta / Surabaya" class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none">
            </div>
            <button onclick="joinQuiz()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black py-3 rounded-xl shadow-lg transition uppercase text-sm">
                Mulai Kerjakan 🚀
            </button>
        </div>

        <!-- 2. QUIZ CONTENT -->
        <div id="participant-quiz" class="hidden space-y-4">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-4 rounded-xl shadow flex justify-between items-center text-white text-xs">
                <div>
                    <p class="opacity-75">Peserta:</p>
                    <p id="display-p-name" class="font-bold text-sm"></p>
                </div>
                <div class="bg-black/30 px-3 py-1 rounded-lg font-mono">
                    📝 Progres: <span id="progress-status">0/0</span>
                </div>
            </div>

            <!-- Tempat Soal Dinamis -->
            <div id="questions-container" class="space-y-4"></div>

            <button onclick="submitQuiz()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl shadow-lg transition text-sm uppercase">
                Kirim Semua Jawaban 🏁
            </button>
        </div>

        <!-- 3. SUCCESS SCREEN -->
        <div id="participant-success" class="hidden bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center space-y-4 shadow-xl">
            <div class="text-5xl">🎉</div>
            <h2 class="text-2xl font-black text-emerald-400">Jawaban Terkirim!</h2>
            <p class="text-sm text-slate-300">Terma kasih. Jawaban Anda sudah masuk ke dashboard pemantauan Trainer.</p>
        </div>
    </main>

    <script>
        const CLOUD_BASE = 'https://kvdb.io/S3K7M1zX9pQ5wR2Y_pwaquiz/';
        let currentPIN = '1988'; 
        let selectedAnswers = {};
        let activeParticipantId = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('session')) {
                currentPIN = urlParams.get('session');
            }
        };

        async function cloudWrite(key, data) {
            await fetch(`${CLOUD_BASE}${currentPIN}_${key}`, { method: 'POST', body: JSON.stringify(data) });
        }

        async function cloudRead(key) {
            const res = await fetch(`${CLOUD_BASE}${currentPIN}_${key}`);
            return res.ok ? await res.json() : null;
        }

        async function joinQuiz() {
            const name = document.getElementById('p-name').value.trim();
            const role = document.getElementById('p-role').value.trim();
            const area = document.getElementById('p-area').value.trim();

            if(!name || !role || !area) { alert('Mohon lengkapi data diri!'); return; }

            activeParticipantId = 'user_' + Date.now();
            document.getElementById('display-p-name').innerText = name;
            document.getElementById('participant-gate').classList.add('hidden');
            document.getElementById('participant-quiz').classList.remove('hidden');

            let participants = await cloudRead('participants') || {};
            participants[activeParticipantId] = { name, role, area, status: 'Mengerjakan', answered: 0 };
            await cloudWrite('participants', participants);

            renderQuestions();
        }

        async function renderQuestions() {
            const container = document.getElementById('questions-container');
            const questions = await cloudRead('questions') || [];
            document.getElementById('progress-status').innerText = `0/${questions.length}`;

            if(questions.length === 0) {
                container.innerHTML = '<div class="bg-white text-slate-900 p-4 rounded-xl text-center font-bold">Belum ada soal aktif dari Trainer.</div>';
                return;
            }

            container.innerHTML = questions.map((q, idx) => {
                // Elemen Gambar jika disediakan oleh Trainer
                const imgHtml = q.image ? `<img src="${q.image}" class="w-full h-auto max-h-40 object-contain rounded-xl mb-3 border border-slate-200" onerror="this.style.display='none'">` : '';
                
                // Elemen Input Response (Ganda vs Isian)
                let responseHtml = '';
                if(q.type === 'ganda') {
                    responseHtml = `
                        <div class="grid grid-cols-1 gap-1.5 text-xs">
                            <button onclick="saveAnswer(this, '${q.id}', 'A')" class="opt-${q.id} w-full text-left p-2.5 rounded-xl border border-slate-200 font-medium flex items-center gap-2"> <span class="w-5 h-5 flex items-center justify-center rounded-full bg-purple-600 text-white font-bold">A</span> ${q.optA} </button>
                            <button onclick="saveAnswer(this, '${q.id}', 'B')" class="opt-${q.id} w-full text-left p-2.5 rounded-xl border border-slate-200 font-medium flex items-center gap-2"> <span class="w-5 h-5 flex items-center justify-center rounded-full bg-amber-500 text-white font-bold">B</span> ${q.optB} </button>
                            <button onclick="saveAnswer(this, '${q.id}', 'C')" class="opt-${q.id} w-full text-left p-2.5 rounded-xl border border-slate-200 font-medium flex items-center gap-2"> <span class="w-5 h-5 flex items-center justify-center rounded-full bg-emerald-600 text-white font-bold">C</span> ${q.optC} </button>
                            <button onclick="saveAnswer(this, '${q.id}', 'D')" class="opt-${q.id} w-full text-left p-2.5 rounded-xl border border-slate-200 font-medium flex items-center gap-2"> <span class="w-5 h-5 flex items-center justify-center rounded-full bg-rose-500 text-white font-bold">D</span> ${q.optD} </button>
                        </div>`;
                } else {
                    responseHtml = `<input type="text" oninput="saveAnswer(null, '${q.id}', this.value)" placeholder="Ketik jawaban singkat Anda disini..." class="w-full p-2.5 rounded-xl border border-slate-300 text-xs focus:outline-none focus:border-indigo-500">`;
                }

                return `
                    <div class="bg-white text-slate-900 p-5 rounded-2xl shadow-xl space-y-2">
                        <span class="bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Soal ${idx + 1} (${q.type === 'ganda' ? 'Pilihan Ganda' : 'Isian'})</span>
                        <h3 class="text-sm font-bold leading-snug">${q.question}</h3>
                        ${imgHtml}
                        ${responseHtml}
                    </div>`;
            }).join('');
        }

        async function saveAnswer(btn, questionId, value) {
            if(btn) {
                document.querySelectorAll(`.opt-${questionId}`).forEach(el => el.classList.remove('border-indigo-600', 'bg-indigo-50'));
                btn.classList.add('border-indigo-600', 'bg-indigo-50');
            }
            
            selectedAnswers[questionId] = value;
            const answeredCount = Object.keys(selectedAnswers).length;

            let participants = await cloudRead('participants') || {};
            if(participants[activeParticipantId]) {
                participants[activeParticipantId].answered = answeredCount;
                await cloudWrite('participants', participants);
            }

            const questions = await cloudRead('questions') || [];
            document.getElementById('progress-status').innerText = `${answeredCount}/${questions.length}`;
        }

        async function submitQuiz() {
            let participants = await cloudRead('participants') || {};
            if(participants[activeParticipantId]) {
                participants[activeParticipantId].status = 'Selesai';
                await cloudWrite('participants', participants);
            }
            document.getElementById('participant-quiz').classList.add('hidden');
            document.getElementById('participant-success').classList.remove('hidden');
        }
    </script>
</body>
</html>
