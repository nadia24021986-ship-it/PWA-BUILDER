<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Dashboard Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4">

    <main class="max-w-4xl mx-auto space-y-6">
        <!-- HEADER & LINK GENERATOR -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h1 class="text-2xl font-black text-indigo-400">👨‍🏫 PANEL KENDALI TRAINER</h1>
            <p class="text-xs text-slate-400 mb-4">Buat hingga 100+ soal dan pantau peserta secara riil.</p>
            
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                <span class="text-xs font-bold text-amber-400 block" id="db-status">Menyiapkan Server Database Pribadi... ⏳</span>
                <div class="flex gap-2">
                    <input type="text" id="share-link-input" readonly class="w-full p-2.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 focus:outline-none" value="Memuat link...">
                    <button onclick="copyLink()" class="bg-emerald-600 text-white px-4 rounded-lg text-xs font-bold whitespace-nowrap">Salin Link</button>
                </div>
                <div class="flex justify-end pt-1">
                    <button onclick="resetServer()" class="text-red-400 text-[11px] hover:underline font-bold">⚠️ Reset Server Sesi Ini</button>
                </div>
            </div>
        </div>

        <!-- FORM PEMBUATAN SOAL -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-bold text-amber-400">📝 Ruang Pembuatan Soal</h2>
                <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">Total: <span id="q-count" class="font-bold text-indigo-400">0</span> / 100+</span>
            </div>

            <div class="space-y-3 text-sm border-b border-slate-700 pb-5">
                <div>
                    <select id="input-type" onchange="toggleTypeView()" class="w-full p-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs">
                        <option value="ganda">Pilihan Ganda (A, B, C, D)</option>
                        <option value="isian">Isian / Jawaban Singkat Text</option>
                    </select>
                </div>
                <input type="text" id="input-question" placeholder="Ketik pertanyaan di sini..." class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none focus:border-indigo-500">
                <input type="text" id="input-image" placeholder="URL Gambar (Opsional - Kosongkan jika tidak ada)" class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none">

                <div id="options-block" class="grid grid-cols-1 md:grid-cols-2 gap-2 pt-1">
                    <input type="text" id="input-optA" placeholder="Teks Opsi A" class="p-2 rounded-xl bg-slate-900 border border-slate-700 text-xs">
                    <input type="text" id="input-optB" placeholder="Teks Opsi B" class="p-2 rounded-xl bg-slate-900 border border-slate-700 text-xs">
                    <input type="text" id="input-optC" placeholder="Teks Opsi C" class="p-2 rounded-xl bg-slate-900 border border-slate-700 text-xs">
                    <input type="text" id="input-optD" placeholder="Teks Opsi D" class="p-2 rounded-xl bg-slate-900 border border-slate-700 text-xs">
                </div>

                <button onclick="addQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg">
                    🚀 Terbitkan Soal Ke Peserta
                </button>
            </div>

            <!-- DAFTAR SOAL YANG SUDAH DIBUAT TERSUSUN DI SINI -->
            <div id="trainer-questions-list" class="space-y-3 pt-2 max-h-60 overflow-y-auto pr-2">
                <p class="text-center text-slate-500 text-xs italic">Belum ada soal yang dibuat.</p>
            </div>
        </div>

        <!-- LIVE MONITORING -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="text-base font-bold text-slate-200 mb-3 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Pantauan Riil Peserta (Otomatis)
            </h2>
            <div class="overflow-x-auto rounded-xl border border-slate-700">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-700 text-slate-300 text-xs uppercase tracking-wider">
                            <th class="p-3">Nama</th>
                            <th class="p-3">Jabatan & Area</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Progres Jawab</th>
                        </tr>
                    </thead>
                    <tbody id="monitor-table-body" class="divide-y divide-slate-700 bg-slate-800/50">
                        <tr><td colspan="4" class="p-4 text-center text-slate-500">Menunggu peserta masuk...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let dbBucket = localStorage.getItem('pwa_db_bucket');
        const sessionPin = 'SEMINAR_1'; 

        window.onload = async function() {
            // Otomatis bikin database server baru kalau belum ada
            if (!dbBucket) {
                try {
                    const res = await fetch('https://kvdb.io/', { method: 'POST' });
                    dbBucket = await res.text();
                    localStorage.setItem('pwa_db_bucket', dbBucket);
                } catch(e) {
                    alert("Gagal membuat server database. Cek koneksi internet."); return;
                }
            }
            
            // Render Link yang sudah disematkan kode server
            const originURL = window.location.origin;
            const finalLink = `${originURL}/index.html?session=${sessionPin}&db=${dbBucket}`;
            document.getElementById('share-link-input').value = finalLink;
            document.getElementById('db-status').innerHTML = `🔗 LINK KUESIONER PESERTA <span class="text-emerald-400 font-normal">(Server Online ✅)</span>:`;
            
            renderTrainerQuestions();
            fetchMonitor();
            setInterval(fetchMonitor, 3000); 
        };

        function toggleTypeView() {
            const type = document.getElementById('input-type').value;
            document.getElementById('options-block').style.display = type === 'ganda' ? 'grid' : 'none';
        }

        async function cloudWrite(key, data) {
            await fetch(`https://kvdb.io/${dbBucket}/${sessionPin}_${key}`, { method: 'POST', body: JSON.stringify(data) });
        }

        async function cloudRead(key) {
            try {
                const res = await fetch(`https://kvdb.io/${dbBucket}/${sessionPin}_${key}`);
                if (res.ok) { const text = await res.text(); return text ? JSON.parse(text) : null; }
            } catch(e) {} return null;
        }

        async function addQuestion() {
            const type = document.getElementById('input-type').value;
            const question = document.getElementById('input-question').value.trim();
            const image = document.getElementById('input-image').value.trim();
            if(!question) { alert('Pertanyaan wajib diisi!'); return; }

            let qData = { id: Date.now().toString(), type, question, image };

            if(type === 'ganda') {
                qData.optA = document.getElementById('input-optA').value.trim();
                qData.optB = document.getElementById('input-optB').value.trim();
                qData.optC = document.getElementById('input-optC').value.trim();
                qData.optD = document.getElementById('input-optD').value.trim();
                if(!qData.optA || !qData.optB || !qData.optC || !qData.optD) { alert('Lengkapi semua opsi A, B, C, D!'); return; }
            }

            const btn = document.querySelector('button[onclick="addQuestion()"]');
            btn.innerText = "Menerbitkan...";
            
            let questions = await cloudRead('questions') || [];
            questions.push(qData);
            await cloudWrite('questions', questions);

            // Bersihkan form
            document.getElementById('input-question').value = '';
            document.getElementById('input-image').value = '';
            document.getElementById('input-optA').value = '';
            document.getElementById('input-optB').value = '';
            document.getElementById('input-optC').value = '';
            document.getElementById('input-optD').value = '';
            btn.innerHTML = "🚀 Terbitkan Soal Ke Peserta";

            renderTrainerQuestions(); // Tampilkan daftar soal di bawah
        }

        async function renderTrainerQuestions() {
            const questions = await cloudRead('questions') || [];
            document.getElementById('q-count').innerText = questions.length;
            const container = document.getElementById('trainer-questions-list');
            
            if(questions.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 text-xs italic">Belum ada soal.</p>'; return;
            }

            container.innerHTML = questions.map((q, i) => `
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 flex justify-between items-start gap-3">
                    <div class="text-xs">
                        <span class="bg-indigo-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">Soal ${i+1}</span>
                        <span class="text-slate-400 ml-2">(${q.type.toUpperCase()})</span>
                        <p class="font-bold text-slate-200 mt-1">${q.question}</p>
                    </div>
                </div>
            `).join('');
        }

        async function fetchMonitor() {
            const tbody = document.getElementById('monitor-table-body');
            const participants = await cloudRead('participants') || {};
            const questions = await cloudRead('questions') || [];
            const keys = Object.keys(participants);

            if(keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500 text-xs">Belum ada peserta yang membuka link.</td></tr>`; return;
            }

            tbody.innerHTML = keys.map(id => {
                const p = participants[id];
                const badge = p.status === 'Selesai' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400 animate-pulse';
                return `
                    <tr class="hover:bg-slate-750 border-t border-slate-700 text-[11px] md:text-xs">
                        <td class="p-3 font-bold text-white">${p.name}</td>
                        <td class="p-3 text-slate-400">${p.role} - ${p.area}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded ${badge}">${p.status}</span></td>
                        <td class="p-3 font-mono font-bold text-indigo-400">${p.answered}/${questions.length}</td>
                    </tr>`;
            }).join('');
        }

        function copyLink() {
            const input = document.getElementById('share-link-input');
            input.select(); navigator.clipboard.writeText(input.value);
            alert('Link sukses disalin! Kirimkan link ini ke grup WA peserta.');
        }

        async function resetServer() {
            if(confirm('Yakin ingin mereset sesi ini? Semua soal & data peserta akan terhapus.')) {
                localStorage.removeItem('pwa_db_bucket');
                location.reload();
            }
        }
    </script>
</body>
</html>
